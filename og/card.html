<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<title>Gateway2America social card source</title>
<!--
  Source for og/gateway2america.png. Rendered to a 1200x630 PNG with:

    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
      --headless=new --disable-gpu --hide-scrollbars \
      --window-size=1200,630 --virtual-time-budget=6000 \
      --screenshot=og/gateway2america.png og/card.html

  Edit this file and re-run that command to change the card.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Public+Sans:wght@400;600;650&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #0B1725;
    color: #FAF6EF;
    font-family: 'Public Sans', system-ui, sans-serif;
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 86px;
  }

  /* The arch corridor, held still — the same motif as the landing page. */
  .glow {
    position: absolute; right: -40px; top: 50%;
    transform: translateY(-50%);
    width: 760px; height: 760px;
    background: radial-gradient(circle at 50% 50%,
      rgba(242,200,126,.40) 0%, rgba(224,163,65,.16) 34%, transparent 68%);
  }
  .rings { position: absolute; right: 120px; top: 50%; transform: translateY(-50%); }
  .ring {
    position: absolute; left: 50%; top: 50%;
    border: 1.5px solid #E0A341;
    border-bottom: 0;
    transform: translate(-50%, -50%);
  }
  .r1 { width: 480px; height: 520px; border-radius: 240px 240px 0 0; opacity: .20; }
  .r2 { width: 360px; height: 400px; border-radius: 180px 180px 0 0; opacity: .34; }
  .r3 { width: 250px; height: 285px; border-radius: 125px 125px 0 0; opacity: .52; }
  .r4 { width: 150px; height: 180px; border-radius:  75px  75px 0 0; opacity: .78; }

  .inner { position: relative; max-width: 660px; }

  .creds {
    display: flex; flex-direction: column; gap: 9px;
    font-size: 15px; font-weight: 650;
    letter-spacing: .09em; text-transform: uppercase;
    color: #E0A341;
    margin-bottom: 30px;
  }
  .creds span { display: flex; align-items: center; gap: 11px; }
  .creds span::before {
    content: ""; width: 6px; height: 6px; border-radius: 50%;
    background: #E0A341; flex-shrink: 0;
  }

  h1 {
    font-family: 'Fraunces', Georgia, serif;
    font-size: 61px; font-weight: 500;
    line-height: 1.07; letter-spacing: -.025em;
    margin-bottom: 26px;
  }
  h1 .accent { color: #F2C87E; }

  p {
    font-size: 23px; line-height: 1.5;
    color: #AFC0CE;
    max-width: 30ch;
  }

  .foot {
    position: absolute; left: 86px; bottom: 44px;
    display: flex; align-items: center; gap: 14px;
    font-size: 19px; font-weight: 650;
    letter-spacing: -.01em;
  }
  .mark { width: 30px; height: 30px; }
</style>
</head>
<body>

<div class="glow"></div>
<div class="rings">
  <span class="ring r1"></span>
  <span class="ring r2"></span>
  <span class="ring r3"></span>
  <span class="ring r4"></span>
</div>

<div class="inner">
  <div class="creds">
    <span>Certificate of Special Congressional Recognition, PA-06</span>
    <span>Princeton Prize in Race Relations</span>
  </div>

  <h1>Nobody should have to figure out U.S. citizenship <span class="accent">on their own</span></h1>

  <p>Free, plain-language help from volunteers. We keep no information about you.</p>
</div>

<div class="foot">
  <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
    <path d="M6 29V14a10 10 0 0 1 20 0v15" fill="none" stroke="#E0A341" stroke-width="2"/>
    <path d="M13 29V15a3 3 0 0 1 6 0v14" fill="none" stroke="#E0A341" stroke-width="1.5" opacity=".65"/>
  </svg>
  <span>Gateway2America</span>
</div>

</body>
</html>
